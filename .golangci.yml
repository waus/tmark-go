version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - copyloopvar
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - makezero
    - mirror
    - nilnesserr
    - nolintlint
    - predeclared
    - thelper
    - tparallel
    - unconvert
    - usetesting
    - wastedassign

formatters:
  enable:
    - gofmt
